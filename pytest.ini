[pytest]
# Collect only the algorithm verification suite.
#
# Three files in this tree match pytest's `test_*.py` discovery pattern but are
# not pytest modules:
#   verification/test_corner_cases.py        standalone script; its body runs at
#                                            import and ends in sys.exit()
#   firmware/shared/factory-test/eos_factory_test.py  needs `bleak` + real BLE hardware
#   prototype/hardware-l3/ble_hardware_test.py        needs real BLE hardware
#
# Collecting them aborted the whole run before any real test executed. Run the
# corner-case script directly instead:  python verification/test_corner_cases.py
testpaths = verification/test_algorithms.py
