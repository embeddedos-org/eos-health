# data-buffer Ztest suite configuration.
CONFIG_ZTEST=y

# Flash stack: real flash API against the simulator (see app.overlay).
CONFIG_FLASH=y
CONFIG_FLASH_SIMULATOR=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y

# data_buffer.c uses these Zephyr subsystems.
CONFIG_CRC=y
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y

# Keep the test app small; no shell, no networking.
CONFIG_SHELL=n
CONFIG_NETWORKING=n
